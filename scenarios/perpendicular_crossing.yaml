name: perpendicular_crossing
description: Two robots cross the same junction on perpendicular straight paths.
nominal_speed_mps: 1.0
tick_interval_seconds: 1.0
max_ticks: 10
resolvable: true
robots:
  - device_id: robot-a
    initial_pose: {x: -1.2, y: 0.0, theta: 0.0}
    path:
      - {x: 1.2, y: 0.0, theta: 0.0}
    loaded: false
    battery_level: 70.0
    deadline_offset_ms: 60000
  - device_id: robot-b
    initial_pose: {x: 0.0, y: -1.2, theta: 1.5707963267948966}
    path:
      - {x: 0.0, y: 1.2, theta: 1.5707963267948966}
    loaded: false
    battery_level: 70.0
    deadline_offset_ms: 60000
