[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "collision-monitor"
version = "0.1.0"
description = "A safety-first collision monitor for robot fleets"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "aio-pika==9.6.2",
    "ortools==9.15.6755",
    "pydantic==2.13.4",
    "PyYAML==6.0.3",
    "shapely==2.1.2",
]

[project.optional-dependencies]
dev = [
    "mypy==1.20.2",
    "pytest==8.4.2",
    "pytest-cov==6.3.0",
    "ruff==0.16.1",
    "types-shapely==2.0.0.20250404",
    "types-PyYAML==6.0.12.20260724",
]

[project.scripts]
collision-monitor = "collision_monitor.__main__:main"
collision-monitor-simulator = "collision_monitor.simulator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "rabbitmq: optional test requiring Docker and an explicitly enabled RabbitMQ broker",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["collision_monitor"]
mypy_path = "src"
