[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "collision-monitor"
version = "0.1.0"
description = "A safety-first collision monitor for robot fleets"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "aio-pika>=9.4,<10",
    "ortools>=9.10,<10",
    "pydantic>=2.7,<3",
    "shapely>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10,<2",
    "pytest>=8.2,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.5,<1",
]

[project.scripts]
collision-monitor = "collision_monitor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["collision_monitor"]
mypy_path = "src"

